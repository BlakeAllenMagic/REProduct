<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 360" class="diagram-svg" role="group" aria-label="Receiver block diagram">
  <!--
    Receiver chain. Each tappable block is a <g data-block="...">.
    Which category a block opens is decided by categories.yaml (blocks list),
    never here. Part-count badges, disabled states and accessibility
    attributes are added by src/views/diagram.js.
    Layout: blocks are 110 x 96 at y=100, signal line at y=148.
  -->
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 Z" class="diagram-arrowhead" />
    </marker>
  </defs>

  <text x="20" y="36" class="diagram-title">Receiver</text>

  <!-- Antenna -->
  <g class="diagram-antenna">
    <path d="M25 52 L65 52 L45 80 Z" />
    <line x1="45" y1="80" x2="45" y2="148" />
  </g>

  <!-- Signal path -->
  <g class="diagram-wires" marker-end="url(#arrow)">
    <path d="M45 148 H88" marker-end="url(#arrow)" />
    <path d="M200 148 H233" marker-end="url(#arrow)" />
    <path d="M345 148 H378" marker-end="url(#arrow)" />
    <path d="M490 148 H523" marker-end="url(#arrow)" />
    <path d="M635 148 H668" marker-end="url(#arrow)" />
    <path d="M780 148 H813" marker-end="url(#arrow)" />
    <path d="M925 148 H975" marker-end="url(#arrow)" />
    <path d="M435 262 V198" marker-end="url(#arrow)" />
  </g>
  <text x="950" y="132" class="diagram-note">DSP</text>

  <g data-block="rf_filter" class="block">
    <rect x="90" y="100" width="110" height="96" rx="12" class="block-bg" />
    <path class="block-symbol" d="M127 124 q4.5 -7 9 0 t9 0 t9 0 t9 0 M127 136 q4.5 -7 9 0 t9 0 t9 0 t9 0 M127 148 q4.5 -7 9 0 t9 0 t9 0 t9 0" />
    <text x="145" y="182" class="block-label">RF Filter</text>
  </g>

  <g data-block="lna" class="block">
    <rect x="235" y="100" width="110" height="96" rx="12" class="block-bg" />
    <path class="block-symbol" d="M272 116 L310 136 L272 156 Z" />
    <text x="290" y="182" class="block-label">LNA</text>
  </g>

  <g data-block="mixer" class="block">
    <rect x="380" y="100" width="110" height="96" rx="12" class="block-bg" />
    <circle class="block-symbol" cx="435" cy="136" r="18" />
    <path class="block-symbol" d="M422.3 123.3 L447.7 148.7 M447.7 123.3 L422.3 148.7" />
    <text x="435" y="182" class="block-label">Mixer</text>
  </g>

  <g data-block="if_filter" class="block">
    <rect x="525" y="100" width="110" height="96" rx="12" class="block-bg" />
    <path class="block-symbol" d="M562 124 q4.5 -7 9 0 t9 0 t9 0 t9 0 M562 136 q4.5 -7 9 0 t9 0 t9 0 t9 0 M562 148 q4.5 -7 9 0 t9 0 t9 0 t9 0" />
    <text x="580" y="182" class="block-label">IF Filter</text>
  </g>

  <g data-block="if_amp" class="block">
    <rect x="670" y="100" width="110" height="96" rx="12" class="block-bg" />
    <path class="block-symbol" d="M707 116 L745 136 L707 156 Z" />
    <text x="725" y="182" class="block-label">IF Amp</text>
  </g>

  <g data-block="adc" class="block">
    <rect x="815" y="100" width="110" height="96" rx="12" class="block-bg" />
    <path class="block-symbol" d="M848 118 H892 V154 H848 Z M848 154 L892 118" />
    <text x="870" y="182" class="block-label">ADC</text>
  </g>

  <g data-block="lo" class="block">
    <rect x="380" y="262" width="110" height="84" rx="12" class="block-bg" />
    <circle class="block-symbol" cx="435" cy="292" r="16" />
    <path class="block-symbol" d="M425 292 q5 -9 10 0 t10 0" />
    <text x="435" y="334" class="block-label">LO</text>
  </g>
</svg>
