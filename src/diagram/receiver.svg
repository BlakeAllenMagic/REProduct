<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 404" class="diagram-svg" role="group" aria-label="Receiver block diagram">
  <!--
    Receiver chain. Each tappable block is a <g data-block="...">.
    Which category a block opens is decided by categories.yaml (blocks list),
    never here. Part-count badges, disabled states and accessibility
    attributes are added by src/views/diagram.js.
    Layout: 7 columns at x = 72 + 128*col, rows at y = 56 + 128*row, blocks 92 x 72.
  -->
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 Z" class="diagram-arrowhead" />
    </marker>
  </defs>

  <text x="20" y="36" class="diagram-title">Receiver</text>
  <g class="diagram-antenna">
    <path d="M14 170 L42 170 L28 192 Z" />
    <line x1="28" y1="192" x2="28" y2="220" />
  </g>
  <g class="diagram-wires">
    <path d="M420 92 H454" marker-end="url(#arrow)" />
    <path d="M548 92 H582" marker-end="url(#arrow)" />
    <path d="M676 92 H710" marker-end="url(#arrow)" />
    <path d="M804 92 H838" marker-end="url(#arrow)" />
    <path d="M566 92 V142 H246 V130" marker-end="url(#arrow)" />
    <path d="M246 56 V46 H502 V54" marker-end="url(#arrow)" />
    <path d="M886 128 V182" marker-end="url(#arrow)" />
    <path d="M932 92 H990" marker-end="url(#arrow)" />
    <path d="M28 220 H70" marker-end="url(#arrow)" />
    <path d="M164 220 H198" marker-end="url(#arrow)" />
    <path d="M292 220 H326" marker-end="url(#arrow)" />
    <path d="M420 220 H454" marker-end="url(#arrow)" />
    <path d="M548 220 H582" marker-end="url(#arrow)" />
    <path d="M676 220 H710" marker-end="url(#arrow)" />
    <path d="M804 220 H838" marker-end="url(#arrow)" />
    <path d="M932 220 H968 V284 H36 V348 H70" marker-end="url(#arrow)" />
    <path d="M164 348 H198" marker-end="url(#arrow)" />
    <path d="M292 348 H326" marker-end="url(#arrow)" />
    <path d="M420 348 H454" marker-end="url(#arrow)" />
    <path d="M548 348 H624" marker-end="url(#arrow)" />
  </g>
  <text x="20" y="97" class="diagram-note" text-anchor="start">LO chain</text>
  <text x="986" y="82" class="diagram-note" text-anchor="end">to TX</text>
  <text x="650" y="353" class="diagram-note" text-anchor="middle">DSP</text>

  <g data-block="lo_prescaler" class="block">
    <rect x="200" y="56" width="92" height="72" rx="10" class="block-bg" />
    <text x="246" y="90" class="block-glyph">÷N</text>
    <text x="246" y="119" class="block-label">Prescaler</text>
  </g>
  <g data-block="lo_osc" class="block">
    <rect x="328" y="56" width="92" height="72" rx="10" class="block-bg" />
    <circle class="block-symbol" cx="374" cy="83" r="14" />
    <path class="block-symbol" d="M365 83 q4.5 -9 9 0 t9 0" />
    <text x="374" y="119" class="block-label">Oscillator</text>
  </g>
  <g data-block="lo_pll" class="block">
    <rect x="456" y="56" width="92" height="72" rx="10" class="block-bg" />
    <text x="502" y="91" class="block-glyph">φ</text>
    <text x="502" y="119" class="block-label">PLL</text>
  </g>
  <g data-block="lo_mult" class="block">
    <rect x="584" y="56" width="92" height="72" rx="10" class="block-bg" />
    <text x="630" y="90" class="block-glyph">×N</text>
    <text x="630" y="119" class="block-label">Multiplier</text>
  </g>
  <g data-block="lo_amp" class="block">
    <rect x="712" y="56" width="92" height="72" rx="10" class="block-bg" />
    <path class="block-symbol" d="M745 68 L774 83 L745 98 Z" />
    <text x="758" y="119" class="block-label">LO Amp</text>
  </g>
  <g data-block="lo_split" class="block">
    <rect x="840" y="56" width="92" height="72" rx="10" class="block-bg" />
    <path class="block-symbol" d="M868 83 H882 L902 71 M882 83 L902 95" />
    <text x="886" y="119" class="block-label">Divider</text>
  </g>
  <g data-block="rx_bias_tee" class="block">
    <rect x="72" y="184" width="92" height="72" rx="10" class="block-bg" />
    <path class="block-symbol" d="M100 219 H136 M118 219 V213 q5 -2 0 -4 q-5 -2 0 -4 q5 -2 0 -4 V197" />
    <text x="118" y="247" class="block-label">Bias Tee</text>
  </g>
  <g data-block="rx_limiter" class="block">
    <rect x="200" y="184" width="92" height="72" rx="10" class="block-bg" />
    <path class="block-symbol" d="M228 201 H264 M246 201 V209 M239 209 H253 L246 219 Z M239 219 H253 M246 219 V225 M240 225 H252" />
    <text x="246" y="247" class="block-label">Limiter</text>
  </g>
  <g data-block="rx_switch" class="block">
    <rect x="328" y="184" width="92" height="72" rx="10" class="block-bg" />
    <path class="block-symbol" d="M356 211 H366 L384 201 M386 201 H392 M386 221 H392" />
    <circle class="block-symbol" cx="366" cy="211" r="2" />
    <circle class="block-symbol" cx="386" cy="221" r="2" />
    <text x="374" y="247" class="block-label">Switch</text>
  </g>
  <g data-block="rf_filter" class="block">
    <rect x="456" y="184" width="92" height="72" rx="10" class="block-bg" />
    <path class="block-symbol" d="M484 203 q4.5 -7 9 0 t9 0 t9 0 t9 0" />
    <path class="block-symbol" d="M484 213 q4.5 -7 9 0 t9 0 t9 0 t9 0" />
    <path class="block-symbol" d="M484 223 q4.5 -7 9 0 t9 0 t9 0 t9 0" />
    <text x="502" y="247" class="block-label">RF Filter</text>
  </g>
  <g data-block="lna" class="block">
    <rect x="584" y="184" width="92" height="72" rx="10" class="block-bg" />
    <path class="block-symbol" d="M617 196 L646 211 L617 226 Z" />
    <text x="630" y="247" class="block-label">LNA</text>
  </g>
  <g data-block="rx_atten" class="block">
    <rect x="712" y="184" width="92" height="72" rx="10" class="block-bg" />
    <path class="block-symbol" d="M740 211 H746 l3 -7 l6 14 l6 -14 l6 14 l3 -7 H776" />
    <text x="758" y="247" class="block-label">Attenuator</text>
  </g>
  <g data-block="mixer" class="block">
    <rect x="840" y="184" width="92" height="72" rx="10" class="block-bg" />
    <circle class="block-symbol" cx="886" cy="211" r="14" />
    <path class="block-symbol" d="M876 201 L896 221 M896 201 L876 221" />
    <text x="886" y="247" class="block-label">Mixer</text>
  </g>
  <g data-block="if_filter" class="block">
    <rect x="72" y="312" width="92" height="72" rx="10" class="block-bg" />
    <path class="block-symbol" d="M100 331 q4.5 -7 9 0 t9 0 t9 0 t9 0" />
    <path class="block-symbol" d="M100 341 q4.5 -7 9 0 t9 0 t9 0 t9 0" />
    <path class="block-symbol" d="M100 351 q4.5 -7 9 0 t9 0 t9 0 t9 0" />
    <text x="118" y="375" class="block-label">IF Filter</text>
  </g>
  <g data-block="if_amp" class="block">
    <rect x="200" y="312" width="92" height="72" rx="10" class="block-bg" />
    <path class="block-symbol" d="M233 324 L262 339 L233 354 Z" />
    <text x="246" y="375" class="block-label">IF Amp</text>
  </g>
  <g data-block="rx_balun" class="block">
    <rect x="328" y="312" width="92" height="72" rx="10" class="block-bg" />
    <path class="block-symbol" d="M356 339 H368 M368 327 V351 M378 327 V351 M378 331 H392 M378 347 H392" />
    <text x="374" y="375" class="block-label">Balun</text>
  </g>
  <g data-block="adc" class="block">
    <rect x="456" y="312" width="92" height="72" rx="10" class="block-bg" />
    <path class="block-symbol" d="M482 324 H522 V354 H482 Z M482 354 L522 324" />
    <text x="502" y="375" class="block-label">ADC</text>
  </g>
</svg>
