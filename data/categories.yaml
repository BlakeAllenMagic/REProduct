# Categories (product types) on the line card.
#
# Generated for Marki Microwave's line by tools/marki/extract_catalogs.py, then kept by hand.
# Each category is one tab in the parts sheet (Google Sheet); the import writes data/parts/<id>.csv.
#
# Fields:
#   id        short lowercase name, also the CSV file name
#   name      shown in the app, and the sheet tab's name
#   blocks    ids of diagram blocks that open this category
#   specs     the spec columns, in the order the parts table shows them
#     key       CSV column name (never shown to customers, safe to keep stable)
#     label     column heading in the app
#     type      number or text
#     unit      number columns only. Cells may be "0.6" or "0.6 dB", never another unit
#     sort      optional: asc (lower is better) or desc (higher is better)
#     required  optional: true means every part must have a value
#
# After editing, run: python3 tools/build_linecard.py

categories:
  - id: amplifier
    name: "Amplifiers"
    blocks: [lna, if_amp, lo_amp, tx_lo_amp, tx_if_amp, tx_driver, tx_pa]
    specs:
      - { key: family, label: "Family", type: text }
      - { key: package, label: "Package", type: text }
      - { key: freq_min_ghz, label: "Freq Min", unit: "GHz", type: number }
      - { key: freq_max_ghz, label: "Freq Max", unit: "GHz", type: number }
      - { key: gain_db, label: "Gain", unit: "dB", type: number, sort: desc }
      - { key: nf_db, label: "NF", unit: "dB", type: number, sort: asc }
      - { key: op1db_dbm, label: "OP1dB", unit: "dBm", type: number, sort: desc }
      - { key: psat_dbm, label: "Psat", unit: "dBm", type: number, sort: desc }
      - { key: oip3_dbm, label: "OIP3", unit: "dBm", type: number, sort: desc }
      - { key: voltage, label: "Supply (V)", type: text }
      - { key: current, label: "Current (mA)", type: text }
      - { key: case, label: "Case", type: text }
      - { key: eccn, label: "ECCN", type: text }

