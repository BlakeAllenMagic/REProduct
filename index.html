<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light" />
    <title>RF Line Card</title>

    <!-- Installable app: name, icons and colors live in the manifest. -->
    <link rel="manifest" href="./manifest.webmanifest" />
    <meta name="theme-color" content="#ffffff" />
    <link rel="icon" href="./icons/icon.svg" type="image/svg+xml" />
    <!-- iPadOS/macOS Safari read these instead of the manifest's icons. -->
    <link rel="apple-touch-icon" href="./icons/apple-touch-icon-180.png" />
    <meta name="apple-mobile-web-app-title" content="Line Card" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <link rel="stylesheet" href="/src/styles/base.css" />
    <link rel="stylesheet" href="/src/styles/diagram.css" />
    <link rel="stylesheet" href="/src/styles/table.css" />
    <link rel="stylesheet" href="/src/styles/viewer.css" />
    <link rel="stylesheet" href="/src/styles/settings.css" />
  </head>
  <body>
    <header class="topbar">
      <a class="topbar-back" id="back" href="#/" hidden>
        <span aria-hidden="true">‹</span> <span id="back-label">Back</span>
      </a>
      <h1 class="topbar-title" id="title">RF Line Card</h1>
      <div class="topbar-actions">
        <span id="actions" class="view-actions"></span>
        <a class="download-chip" id="download-chip" href="#/settings" hidden></a>
        <a class="btn btn-icon" id="settings-link" href="#/settings" aria-label="Settings">
          <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true">
            <path
              fill="none"
              stroke="currentColor"
              stroke-width="1.8"
              stroke-linejoin="round"
              d="M12 15.2a3.2 3.2 0 1 0 0-6.4 3.2 3.2 0 0 0 0 6.4Zm7.4-2.1.1-1.1-.1-1.1 2-1.6-2-3.4-2.4.8a7.6 7.6 0 0 0-1.9-1.1L14.6 3h-4l-.5 2.6a7.6 7.6 0 0 0-1.9 1.1l-2.4-.8-2 3.4 2 1.6-.1 1.1.1 1.1-2 1.6 2 3.4 2.4-.8c.6.5 1.2.8 1.9 1.1l.5 2.6h4l.5-2.6c.7-.3 1.3-.6 1.9-1.1l2.4.8 2-3.4-2-1.6Z"
            />
          </svg>
        </a>
      </div>
    </header>
    <div class="errors" id="errors" aria-live="assertive"></div>
    <main class="view" id="view"></main>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
